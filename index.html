<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fernando Jiménez — E-Learning Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --bg2:       #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #7d8590;
      --accent:    #58a6ff;
      --accent2:   #3fb950;
      --accent3:   #d2a8ff;
      --accent4:   #ffa657;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .grid-line {
      position: fixed;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--border);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── LANG TOGGLE ─── */
    .lang-bar {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 100;
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      background: var(--bg);
    }

    .lang-btn {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      border: none;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .lang-btn.active {
      background: var(--border);
      color: var(--text);
    }

    .lang-btn:not(.active):hover {
      color: var(--accent);
    }

    /* ─── WRAP ─── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ─── HEADER ─── */
    header {
      padding: 72px 0 52px;
      border-bottom: 1px solid var(--border);
    }

    .company-tag {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .company-tag::before {
      content: '';
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: var(--font-head);
      font-size: clamp(40px, 6.5vw, 76px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    h1 .last { color: var(--muted); font-weight: 400; }

    .role-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .role { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
    .sep  { width: 4px; height: 4px; border-radius: 50%; background: var(--border); }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 500px;
      margin-top: 20px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }
    .tool-pill {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 4px 10px;
      background: var(--bg2);
      transition: border-color 0.2s, color 0.2s;
    }
    .tool-pill:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── SECTION ─── */
    section { padding: 60px 0; }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ─── CARDS ─── */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .card {
      background: var(--bg);
      padding: 36px 30px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s ease;
    }

    .card:hover { background: var(--bg2); }
    .card:hover::after { transform: scaleX(1); }

    .card-sl1::after { background: var(--accent); }
    .card-sl1 .card-label { color: var(--accent); }
    .card-sl1:hover .card-arrow { color: var(--accent); }

    .card-sl2::after { background: var(--accent4); }
    .card-sl2 .card-label { color: var(--accent4); }
    .card-sl2:hover .card-arrow { color: var(--accent4); }

    .card-ri1::after { background: var(--accent2); }
    .card-ri1 .card-label { color: var(--accent2); }
    .card-ri1:hover .card-arrow { color: var(--accent2); }

    .card-ri2::after { background: var(--accent3); }
    .card-ri2 .card-label { color: var(--accent3); }
    .card-ri2:hover .card-arrow { color: var(--accent3); }

    .card-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .card h2 {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-top: 4px;
    }

    .card p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.75;
      flex: 1;
    }

    .card-arrow {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s, gap 0.2s;
    }
    .card:hover .card-arrow { gap: 12px; }

    /* ─── ABOUT ─── */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }
    .about-block h3 {
      font-family: var(--font-head);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }
    .about-block p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.85;
    }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-left { display: flex; flex-direction: column; gap: 4px; }
    .footer-name {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .footer-company {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--border);
    }
    .footer-note { font-size: 11px; color: var(--border); letter-spacing: 0.06em; }

    /* ─── FADE ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    header      { animation: fadeUp 0.5s ease both; }
    .cards      { animation: fadeUp 0.5s ease 0.12s both; }
    .about-grid { animation: fadeUp 0.5s ease 0.22s both; }

    /* ─── LANG SWAP TRANSITION ─── */
    .lang-fade { transition: opacity 0.18s ease; }
    .lang-fade.switching { opacity: 0; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 620px) {
      .cards      { grid-template-columns: 1fr; }
      .about-grid { grid-template-columns: 1fr; gap: 28px; }
      footer      { flex-direction: column; align-items: flex-start; }
      .lang-bar   { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>

<div class="grid-line"></div>

<!-- LANGUAGE TOGGLE -->
<div class="lang-bar" role="group" aria-label="Language selector">
  <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
  <button class="lang-btn"        data-lang="en" onclick="setLang('en')">EN</button>
</div>

<div class="wrap lang-fade" id="main-content">

  <!-- HEADER -->
  <header>
    <p class="company-tag">Paradigm Technologies</p>

    <h1>Fernando <span class="last">Jiménez</span></h1>

    <div class="role-line">
      <span class="role" data-i18n="role1"></span>
      <span class="sep"></span>
      <span class="role" data-i18n="role2"></span>
      <span class="sep"></span>
      <span class="role" data-i18n="role3"></span>
    </div>

    <p class="subtitle" data-i18n="subtitle"></p>

    <div class="tools">
      <span class="tool-pill">Articulate Storyline</span>
      <span class="tool-pill">Rise 360</span>
      <span class="tool-pill">Adobe Captivate</span>
      <span class="tool-pill">ADDIE</span>
      <span class="tool-pill">SCORM</span>
      <span class="tool-pill">Adobe Suite</span>
      <span class="tool-pill">Figma</span>
      <span class="tool-pill">iSpring Suite</span>
    </div>
  </header>

  <!-- DEMOS -->
  <section>
    <p class="section-label" data-i18n="demosLabel"></p>

    <div class="cards">

      <a class="card card-sl1" href="./storyline-demo-1/" target="_blank" rel="noopener">
        <span class="card-label">Articulate Storyline</span>
        <h2 data-i18n="sl1Title"></h2>
        <p  data-i18n="sl1Desc"></p>
        <span class="card-arrow" data-i18n="cta"></span>
      </a>

      <a class="card card-sl2" href="./storyline-demo-2/" target="_blank" rel="noopener">
        <span class="card-label">Articulate Storyline</span>
        <h2 data-i18n="sl2Title"></h2>
        <p  data-i18n="sl2Desc"></p>
        <span class="card-arrow" data-i18n="cta"></span>
      </a>

      <a class="card card-ri1" href="./rise-demo-1/" target="_blank" rel="noopener">
        <span class="card-label">Articulate Rise 360</span>
        <h2 data-i18n="ri1Title"></h2>
        <p  data-i18n="ri1Desc"></p>
        <span class="card-arrow" data-i18n="cta"></span>
      </a>

      <a class="card card-ri2" href="./rise-demo-2/" target="_blank" rel="noopener">
        <span class="card-label">Articulate Rise 360</span>
        <h2 data-i18n="ri2Title"></h2>
        <p  data-i18n="ri2Desc"></p>
        <span class="card-arrow" data-i18n="cta"></span>
      </a>

    </div>
  </section>

  <!-- ABOUT -->
  <section style="padding-top:0;">
    <p class="section-label" data-i18n="aboutLabel"></p>

    <div class="about-grid">
      <div class="about-block">
        <h3 data-i18n="proc1Title"></h3>
        <p  data-i18n="proc1Desc"></p>
      </div>
      <div class="about-block">
        <h3 data-i18n="proc2Title"></h3>
        <p  data-i18n="proc2Desc"></p>
      </div>
    </div>
  </section>

</div>

<!-- FOOTER -->
<footer class="wrap">
  <div class="footer-left">
    <span class="footer-name">Fernando Jiménez</span>
    <span class="footer-company">Paradigm Technologies</span>
  </div>
  <span class="footer-note" data-i18n="footerNote"></span>
</footer>

<script>
  const i18n = {
    es: {
      role1:      'Instructional Designer',
      role2:      'E-Learning Developer',
      role3:      '+5 años de experiencia',
      subtitle:   'Diseño y desarrollo de experiencias de aprendizaje interactivas a partir de contenido complejo. Especialista en SCORM, producción audiovisual para e-learning y metodología ADDIE.',
      demosLabel: 'Demos interactivos',
      sl1Title:   'Módulo con Escenarios Ramificados',
      sl1Desc:    'Navegación no lineal con decisiones del usuario, retroalimentación contextual y evaluación final con resultados personalizados.',
      sl2Title:   'Interacciones y Evaluación',
      sl2Desc:    'Módulo con interacciones personalizadas, arrastrar y soltar, banco de preguntas y tracking SCORM completo.',
      ri1Title:   'Curso Responsivo — Microlearning',
      ri1Desc:    'Diseño adaptativo con bloques estructurados, lecciones breves orientadas a mobile-first y evaluación de cierre.',
      ri2Title:   'Onboarding Corporativo',
      ri2Desc:    'Curso de inducción con acceso por secciones, multimedia integrado, lecciones tipo flashcard y checklist de progreso.',
      cta:        'Ver demo →',
      aboutLabel: 'Sobre el trabajo',
      proc1Title: 'Proceso',
      proc1Desc:  'Aplico ADDIE de forma rigurosa: análisis de audiencia y objetivos, diseño instruccional documentado en storyboards, desarrollo en la herramienta adecuada al contexto, y validación antes de publicación en LMS.',
      proc2Title: 'Especialidad',
      proc2Desc:  'Transformación de material fuente —manuales, SOPs, normativas— en cursos SCORM interactivos. Producción audiovisual integrada: guiones, grabación, edición y postproducción para e-learning.',
      footerNote: 'E-Learning · Diseño Instruccional · 2025',
    },
    en: {
      role1:      'Instructional Designer',
      role2:      'E-Learning Developer',
      role3:      '5+ years of experience',
      subtitle:   'I design and develop interactive learning experiences from complex source material. Specialist in SCORM, audiovisual production for e-learning, and the ADDIE methodology.',
      demosLabel: 'Interactive demos',
      sl1Title:   'Branching Scenario Module',
      sl1Desc:    'Non-linear navigation driven by user decisions, contextual feedback, and a final assessment with personalized results.',
      sl2Title:   'Interactions & Assessment',
      sl2Desc:    'Module featuring custom interactions, drag-and-drop activities, a question bank, and full SCORM tracking.',
      ri1Title:   'Responsive Course — Microlearning',
      ri1Desc:    'Adaptive design with structured content blocks, short mobile-first lessons, and a closing quiz.',
      ri2Title:   'Corporate Onboarding',
      ri2Desc:    'Induction course with section-based access, integrated multimedia, flashcard-style lessons, and a progress checklist.',
      cta:        'View demo →',
      aboutLabel: 'About the work',
      proc1Title: 'Process',
      proc1Desc:  'I apply ADDIE rigorously: audience and objectives analysis, instructional design documented in storyboards, development with the right tool for the context, and validation before LMS publication.',
      proc2Title: 'Specialty',
      proc2Desc:  'Turning source material — manuals, SOPs, regulations — into interactive SCORM courses. Integrated audiovisual production: scripting, recording, editing, and post-production for e-learning.',
      footerNote: 'E-Learning · Instructional Design · 2025',
    }
  };

  let currentLang = 'es';

  function applyLang(lang) {
    const strings = i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (strings[key] !== undefined) el.textContent = strings[key];
    });
    document.documentElement.setAttribute('lang', lang);
    document.querySelector('title').textContent =
      lang === 'es'
        ? 'Fernando Jiménez — Portafolio E-Learning'
        : 'Fernando Jiménez — E-Learning Portfolio';
  }

  function setLang(lang) {
    if (lang === currentLang) return;
    currentLang = lang;

    // update buttons
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    // fade transition
    const content = document.getElementById('main-content');
    content.classList.add('switching');
    setTimeout(() => {
      applyLang(lang);
      content.classList.remove('switching');
    }, 180);
  }

  // init on load
  applyLang(currentLang);
</script>

</body>
</html>
